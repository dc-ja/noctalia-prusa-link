# PrusaLink — Noctalia Shell plugin (Noctalia 5, Luau)
# Manifest reference: https://docs.noctalia.dev/noctalia/plugins/development/manifest/

id          = "dc-ja/prusa-link"
name        = "PrusaLink"
version     = "0.7.0"
plugin_api  = 24
author      = "dc-ja"
license     = "MIT"
icon        = "printer"
description = "Shows your Prusa printer's live state and print progress on the bar, with a status panel, temperature graphs, storage browser and job controls."
tags        = ["Bar", "3D Printing", "IoT"]

# ── Plugin-level settings ──────────────────────────────────────────────────────
# Shared by every entry; edited under Settings → Plugins.
# Labels/descriptions are translation keys resolved against translations/en.json.

[[setting]]
key             = "url"
type            = "string"
label_key       = "settings.url.label"
description_key = "settings.url.description"
default         = "" # empty = unconfigured; the service stays offline until set

[[setting]]
key             = "username"
type            = "string"
label_key       = "settings.username.label"
description_key = "settings.username.description"
default         = "maker"

[[setting]]
key             = "password"
type            = "string"
label_key       = "settings.password.label"
description_key = "settings.password.description"
default         = ""

[[setting]]
key             = "offline_refresh_sec"
type            = "int"
label_key       = "settings.offline_refresh_sec.label"
description_key = "settings.offline_refresh_sec.description"
default         = 10
min             = 1
max             = 120
advanced        = true

[[setting]]
key             = "idle_refresh_sec"
type            = "int"
label_key       = "settings.idle_refresh_sec.label"
description_key = "settings.idle_refresh_sec.description"
default         = 2
min             = 1
max             = 120
advanced        = true

[[setting]]
key             = "printing_refresh_sec"
type            = "int"
label_key       = "settings.printing_refresh_sec.label"
description_key = "settings.printing_refresh_sec.description"
default         = 1
min             = 1
max             = 120
advanced        = true

# ── Bar-widget label visibility ─────────────────────────────────────────
# Per-state toggles for the bar widget's text label (all advanced). The label
# stays visible in every state except idle and offline by default.

[[setting]]
key             = "label_visible_offline"
type            = "bool"
label_key       = "settings.label_visible_offline.label"
description_key = "settings.label_visible_offline.description"
default         = false
advanced        = true

[[setting]]
key             = "label_visible_idle"
type            = "bool"
label_key       = "settings.label_visible_idle.label"
description_key = "settings.label_visible_idle.description"
default         = false
advanced        = true

[[setting]]
key             = "label_visible_ready"
type            = "bool"
label_key       = "settings.label_visible_ready.label"
description_key = "settings.label_visible_ready.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_busy"
type            = "bool"
label_key       = "settings.label_visible_busy.label"
description_key = "settings.label_visible_busy.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_printing"
type            = "bool"
label_key       = "settings.label_visible_printing.label"
description_key = "settings.label_visible_printing.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_paused"
type            = "bool"
label_key       = "settings.label_visible_paused.label"
description_key = "settings.label_visible_paused.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_finished"
type            = "bool"
label_key       = "settings.label_visible_finished.label"
description_key = "settings.label_visible_finished.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_stopped"
type            = "bool"
label_key       = "settings.label_visible_stopped.label"
description_key = "settings.label_visible_stopped.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_error"
type            = "bool"
label_key       = "settings.label_visible_error.label"
description_key = "settings.label_visible_error.description"
default         = true
advanced        = true

[[setting]]
key             = "label_visible_attention"
type            = "bool"
label_key       = "settings.label_visible_attention.label"
description_key = "settings.label_visible_attention.description"
default         = true
advanced        = true

# ── Entries ────────────────────────────────────────────────────────────────────
# Addressed everywhere as "dc-ja/prusa-link:<id>" (noctalia.togglePanel,
# noctalia msg plugin dc-ja/prusa-link:<id> ..., panel-toggle).

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "widget"
entry = "widget.luau"

[[panel]]
id        = "panel"
entry     = "panel.luau"
width     = 600
height    = 640
placement = "attached"